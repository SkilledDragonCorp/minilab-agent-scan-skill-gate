[project]
name = "skill-gate"
version = "0.1.0"
description = "SkilledDragon minilab: gate new Claude/Cursor skills and MCP configs with Snyk Agent Scan"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "SkilledDragon LLC", email = "hello@skilleddragon.com" }]
requires-python = ">=3.10"
dependencies = [
    "snyk-agent-scan==0.6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
skill-gate = "skill_gate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_gate"]

[tool.hatch.build.targets.wheel.sources]
"src/skill_gate" = "skill_gate"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires SNYK_TOKEN; skipped when unset",
]
